version: 2

models:
  - name: mart_vpp_capacity_hourly
    description: >
      Each row represents the aggregated VPP fleet status for one hour in one region
      and cluster. Shows how many VPP-enrolled devices were active, their combined and
      average battery state-of-charge, total and average solar generation, and the net
      grid flow (positive = fleet is importing from grid, negative = fleet is exporting
      to grid).
    columns:
      - name: hour
        description: Hour timestamp
        tests:
          - not_null
      - name: region
        description: German region (North, South, East, West)
        tests:
          - not_null
      - name: cluster_id
        description: VPP geographic cluster identifier
      - name: active_vpp_devices
        description: Count of active VPP devices in this hour/region
      - name: total_battery_soc
        description: Sum of battery state-of-charge percentages
      - name: avg_battery_soc_pct
        description: Average battery SoC percentage
      - name: total_solar_yield_kw
        description: Total solar generation in kW
      - name: avg_solar_yield_kw
        description: Average solar yield per device
      - name: net_grid_kw
        description: Net grid import/export (negative = export to grid)

  - name: mart_vpp_price_optimization
    description: >
      Each row represents one customer's battery performance for one hour, joined with the
      market price for that hour. Contains the customer's average solar yield, battery SOC,
      heat pump consumption, and grid import/export — plus the day-ahead price, a price zone
      classification (NEGATIVE/LOW/MEDIUM/HIGH), the corresponding battery action
      (MAX_CHARGE/CHARGE/DISCHARGE/SELF_CONSUME), and the calculated financial impact:
      import cost, export revenue, net margin, and the 70/30 revenue split between customer
      and EPOWER. Inspired by 1KOMMA5 Heartbeat AI strategy.
    columns:
      - name: hour
        description: Hour timestamp
        tests:
          - not_null
      - name: customer_key
        description: Customer identifier
        tests:
          - not_null
      - name: cluster_id
        description: VPP geographic cluster identifier
      - name: price_zone
        description: "Price classification: NEGATIVE, LOW, MEDIUM, HIGH, NO_PRICE_DATA"
      - name: battery_action
        description: "Strategy action: MAX_CHARGE, CHARGE, DISCHARGE, SELF_CONSUME"
      - name: price_eur_mwh
        description: Day-ahead price in EUR/MWh
      - name: price_eur_kwh
        description: Day-ahead price in EUR/kWh
      - name: import_cost_eur
        description: Cost of grid import for this hour
      - name: export_revenue_eur
        description: Revenue from grid export for this hour
      - name: net_margin_eur
        description: Net margin (export revenue - import cost)
      - name: customer_margin_eur
        description: Customer share of margin (70%)
      - name: epower_margin_eur
        description: EPOWER share of margin (30%)

  - name: mart_vpp_cluster_map
    description: >
      Each row represents one VPP cluster's aggregated status for one hour. Rolls up
      mart_vpp_price_optimization by geographic cluster, showing active device count,
      average battery SOC, average solar yield, total grid import/export, net energy flow,
      and the average market price. Designed for geographic map visualization — each row
      maps to one cluster dot on the map at one point in time.
    columns:
      - name: hour
        description: Hour timestamp
        tests:
          - not_null
      - name: cluster_id
        description: VPP geographic cluster identifier
        tests:
          - not_null
      - name: active_devices
        description: Count of distinct active VPP devices in this cluster/hour
      - name: avg_soc_pct
        description: Average battery state-of-charge percentage
      - name: avg_solar_kw
        description: Average solar yield per device
      - name: total_import_kwh
        description: Total grid import in kWh
      - name: total_export_kwh
        description: Total grid export in kWh
      - name: net_flow_kwh
        description: Net grid flow (positive = importing, negative = exporting)
      - name: avg_price_eur_mwh
        description: Average day-ahead price in EUR/MWh
