version: 2

models:
  - name: mart_day_ahead_prices
    description: >
      Each row represents a single 15-minute price interval on the German day-ahead
      electricity market (EPEX Spot, DE-LU bidding zone). Contains the delivery date,
      start/end time of the interval, the wholesale price in both EUR/MWh (market unit)
      and EUR/kWh (consumer unit), plus derived time dimensions (hour of day, day of week)
      for pattern analysis.
    columns:
      - name: start_time
        description: Start of price interval
        tests:
          - not_null
      - name: price_eur_mwh
        description: Day-ahead spot price in EUR/MWh
        tests:
          - not_null
      - name: price_eur_kwh
        description: Day-ahead spot price in EUR/kWh
      - name: hour_of_day
        description: Hour of day (0-23) for time-of-day analysis
      - name: day_of_week
        description: Day of week for weekly pattern analysis
