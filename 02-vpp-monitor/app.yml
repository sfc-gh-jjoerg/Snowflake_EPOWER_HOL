version: 2

name: EPOWER_VPP_MONITOR
database: SNOWFLAKE_APPS
schema: PUBLIC
query_warehouse: SNOWFLAKE_APPS_QUERY_WH

label: "EPOWER VPP Monitor"
description: "Real-time Virtual Power Plant performance dashboard showing fleet capacity, day-ahead price optimization, and financial margins across regions and customer segments."
icon: public/icon.svg

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
  - tsconfig.tsbuildinfo
  - output

install:
  commands:
    - [npm, ci]
build:
  commands:
    - [npm, run, build]
    - [cp, -r, .next/static, .next/standalone/.next/static]
    - [cp, -r, public, .next/standalone/public]
    - [rm, -rf, node_modules]
run:
  command: [node, .next/standalone/server.js]
